# Global tool versions (replaces nvm and pyenv). `mise use -g <tool>@<version>` edits the
# deployed copy of this file: run `chezmoi re-add` afterwards to bring it back here.

[tools]
node = "25"
python = "3.14.8"
"npm:@google/gemini-cli" = "latest"
"npm:prettier" = "latest"

[settings]
# Keep honoring .nvmrc / .node-version / .python-version files in projects (nvm, pyenv)
idiomatic_version_file_enable_tools = ["node", "python"]
